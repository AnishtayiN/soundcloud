plugins {
    id 'com.android.application'
}

// Version can be overridden from CI:  -PappVersionName=1.2.3 -PappVersionCode=12
def appVersionName = (project.findProperty("appVersionName") ?: "1.0.0").toString()
def appVersionCode = (project.findProperty("appVersionCode") ?: "1").toString().toInteger()

android {
    namespace 'com.soundcloudx.app'
    compileSdk 34

    defaultConfig {
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        applicationId "com.soundcloudx.app"
        minSdk 24          // Android 7.0 (Nougat) ... Android 15 / 16
        targetSdk 34
        versionCode appVersionCode
        versionName appVersionName
        resourceConfigurations += ["fa", "en"]
    }

    // Release signing.
    // In CI we generate a keystore and pass its path/passwords through env vars.
    // Without those env vars the release build is signed with the debug key so
    // that a locally built APK is still installable on a real phone.
    def ksPath = System.getenv("KEYSTORE_FILE")
    def hasKey = ksPath != null && !ksPath.isEmpty() && file(ksPath).exists()

    signingConfigs {
        if (hasKey) {
            release {
                storeFile file(ksPath)
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig hasKey ? signingConfigs.release : signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ".debug"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    buildFeatures {
        buildConfig true
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            outputFileName = "SoundCloudX-${appVersionName}-${variant.buildType.name}.apk"
        }
    }
}

dependencies {
    // AndroidX Security uses the hardware-backed Android Keystore for cookies
    // and signed track metadata. All other app logic remains framework-only.
    implementation 'androidx.security:security-crypto:1.1.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
    androidTestImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
}
