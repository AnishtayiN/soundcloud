plugins {
    id 'com.android.application'
}

// Version can be overridden from CI:  -PappVersionName=1.2.3 -PappVersionCode=12
def appVersionName = (project.findProperty("appVersionName") ?: "1.0.1").toString()
def appVersionCode = (project.findProperty("appVersionCode") ?: "1").toString().toInteger()

android {
    namespace 'com.soundcloudx.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.soundcloudx.app"
        minSdk 24          // Android 7.0 (Nougat) ... Android 15 / 16
        targetSdk 34
        versionCode appVersionCode
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        resourceConfigurations += ["fa", "en"]
    }

    // Release signing.
    // In CI we generate a keystore and pass its path/passwords through env vars.
    // Without those env vars the release build is signed with the debug key so
    // that a locally built APK is still installable on a real phone.
    def ksPath = System.getenv("KEYSTORE_FILE")
    def hasKey = ksPath != null && !ksPath.isEmpty() && file(ksPath).exists()

    signingConfigs {
        if (hasKey) {
            release {
                storeFile file(ksPath)
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig hasKey ? signingConfigs.release : signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ".debug"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            outputFileName = "SoundCloudX-${appVersionName}-${variant.buildType.name}.apk"
        }
    }
}

dependencies {
    // Real HLS/progressive playback engine, bundled in the APK (not a website
    // shortcut and not a downloader that fetches its runtime on first launch).
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.4.1'
    implementation 'androidx.core:core:1.13.1'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:core:1.6.1'
}
