name: Build & verify Android / Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  APP_NAME: SoundCloudX
  PYTHON_VERSION: '3.8'

jobs:
  checks:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install verification dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb ffmpeg python3-tk
          python -m pip install -r windows/requirements.txt
          python -m pip install javalang
      - name: Android source, resource, RTL and manifest checks
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          "$SDK/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-34'
          python tools/check_android.py "$SDK/platforms/android-34/android.jar"
      - name: Desktop regression tests (including Tk UI)
        run: xvfb-run -a python windows/selftest.py --ui
      - name: Desktop packaged-entrypoint smoke test
        env:
          SDL_AUDIODRIVER: dummy
          SCX_SMOKE_REPORT: desktop-smoke.json
        run: xvfb-run -a python windows/src/main.py --smoke-test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-test-reports
          path: desktop-smoke.json
          if-no-files-found: warn

  android:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and APK builds
        working-directory: android
        run: ./gradlew --no-daemon --max-workers=2 testDebugUnitTest assembleDebug assembleDebugAndroidTest assembleRelease
      - name: Configure release signing
        shell: bash
        env:
          KS_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KS_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "$KS_BASE64" ]; then
            printf '%s' "$KS_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            {
              echo "KEYSTORE_PASSWORD=$KS_PASSWORD"
              echo "KEY_ALIAS=$KS_ALIAS"
              echo "KEY_PASSWORD=$KS_KEY_PASSWORD"
            } >> "$GITHUB_ENV"
          else
            # Preserve the existing installable-APK behavior for repositories
            # without a stable signing secret. Never upload this temporary key.
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.keystore" \
              -alias soundcloudx -keyalg RSA -keysize 2048 -validity 10950 \
              -storepass soundcloudx -keypass soundcloudx \
              -dname "CN=SoundCloud X, OU=Android, O=SoundCloud X, C=IR"
            {
              echo "KEYSTORE_PASSWORD=soundcloudx"
              echo "KEY_ALIAS=soundcloudx"
              echo "KEY_PASSWORD=soundcloudx"
            } >> "$GITHUB_ENV"
          fi
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
      - name: Build signed release APK
        working-directory: android
        run: ./gradlew --no-daemon --max-workers=2 assembleRelease
      - name: Stage APKs and reports
        run: |
          mkdir -p artifacts/release artifacts/testing
          cp android/app/build/outputs/apk/release/*.apk artifacts/release/
          cp android/app/build/outputs/apk/debug/*.apk artifacts/testing/
          cp android/app/build/outputs/apk/androidTest/debug/*.apk artifacts/testing/
      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: artifacts/release/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-testing
          path: artifacts/testing/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-unit-reports
          path: android/app/build/test-results/testDebugUnitTest/*.xml

  android-smoke:
    needs: android
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 24
            android: '7.0'
          - api: 34
            android: '14'
          - api: 36
            android: '16'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/download-artifact@v4
        with:
          name: android-testing
          path: testing
      - uses: actions/download-artifact@v4
        with:
          name: android-release
          path: release
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install release, then run deterministic UI smoke on Android ${{ matrix.android }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-snapshot -camera-back none -camera-front none
          script: bash tools/ci_android_smoke.sh
      - name: Collect emulator evidence
        if: always()
        run: |
          mkdir -p emulator-evidence
          timeout 20s adb pull /sdcard/Android/data/com.soundcloudx.app.debug/files/smoke-fa-${{ matrix.api }}.png emulator-evidence/ || true
          timeout 20s adb logcat -d -s SoundCloudX:* AndroidRuntime:E > emulator-evidence/logcat.txt || true
          cp instrumentation.txt emulator-evidence/ || true
          cp release-ui.xml emulator-evidence/ || true
          cp -r android/app/build/outputs/androidTest-results emulator-evidence/ || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-${{ matrix.api }}-smoke
          path: emulator-evidence
          if-no-files-found: warn

  windows:
    needs: checks
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: x64
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r windows/requirements.txt pyinstaller
      - name: Source regression tests
        run: python windows/selftest.py --ui
      - name: Build EXE
        working-directory: windows
        run: pyinstaller SoundCloudX.spec --noconfirm --clean
      - name: Smoke-test Windows source entrypoint
        shell: pwsh
        env:
          SDL_AUDIODRIVER: dummy
        run: |
          $env:SCX_SMOKE_REPORT = Join-Path $PWD 'windows-source-smoke.json'
          python windows/src/main.py --smoke-test
          if ($LASTEXITCODE -ne 0) { Get-Content $env:SCX_SMOKE_REPORT; throw 'source smoke failed' }
          Get-Content $env:SCX_SMOKE_REPORT
      - name: Stage executable for verification
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          $exe = Get-ChildItem windows/dist -Recurse -Filter '*.exe' | Select-Object -First 1
          Copy-Item $exe.FullName (Join-Path 'artifacts' 'SoundCloudX.exe')
      - name: Smoke-test actual EXE with real DPAPI
        shell: pwsh
        env:
          SDL_AUDIODRIVER: dummy
        run: |
          $exe = Get-ChildItem windows/dist -Recurse -Filter '*.exe' | Select-Object -First 1
          $env:SCX_SMOKE_REPORT = Join-Path $PWD 'windows-smoke.json'
          $process = Start-Process -FilePath $exe.FullName -ArgumentList '--smoke-test' -PassThru
          if (-not $process.WaitForExit(120000)) {
            $process.Kill()
            if (Test-Path $env:SCX_SMOKE_REPORT) { Get-Content $env:SCX_SMOKE_REPORT }
            throw 'EXE smoke timed out'
          }
          if (-not (Test-Path $env:SCX_SMOKE_REPORT)) { throw 'EXE produced no smoke report' }
          Get-Content $env:SCX_SMOKE_REPORT
          if ($process.ExitCode -ne 0) { throw "EXE smoke failed: $($process.ExitCode)" }
      - name: Stage executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          $exe = Get-ChildItem windows/dist -Recurse -Filter '*.exe' | Select-Object -First 1
          Copy-Item $exe.FullName (Join-Path 'artifacts' 'SoundCloudX.exe')
      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: artifacts/SoundCloudX.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe-unverified
          path: artifacts/SoundCloudX.exe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-smoke-report
          path: |
            windows-smoke.json
            windows-source-smoke.json
          if-no-files-found: warn

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [checks, android, android-smoke, windows]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-release
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: windows-exe
          path: release
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
