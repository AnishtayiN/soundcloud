name: Build & Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (major.minor.patch; empty = 1.0.<run number>)"
        required: false
        default: ""
      prerelease:
        description: "Publish as a pre-release"
        type: boolean
        default: false
  push:
    branches: [main, 'arena/**']
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

concurrency:
  group: soundcloudx-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.version.outputs.name }}
      code: ${{ steps.version.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        name: Validate release version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          python3 tools/resolve_version.py >> "$GITHUB_OUTPUT"

  android:
    name: Build full Android app
    needs: version
    runs-on: ubuntu-latest
    outputs:
      signing: ${{ steps.sign.outputs.signing }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install build platform
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-
      # Development key only. Production signing keys belong in repository
      # secrets, never in Git or in an Actions cache. Cache eviction/re-scoping
      # can replace this development key, so these builds are pre-releases.
      - uses: actions/cache@v4
        with:
          path: ~/.soundcloudx/development.keystore
          key: scx-development-signing-v1-${{ github.ref_name }}
      - name: Configure signing (persistent secret, or development pre-release)
        id: sign
        env:
          KS_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KS_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "$KS_BASE64" ]; then
            [ -n "$KS_PASSWORD" ] && [ -n "$KS_ALIAS" ] && [ -n "$KS_KEY_PASSWORD" ]
            printf '%s' "$KS_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=$KS_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$KS_ALIAS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$KS_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo 'signing=production' >> "$GITHUB_OUTPUT"
          else
            mkdir -p "$HOME/.soundcloudx"
            KEY="$HOME/.soundcloudx/development.keystore"
            if [ ! -f "$KEY" ]; then
              keytool -genkeypair -keystore "$KEY" -storetype JKS -alias soundcloudx \
                -keyalg RSA -keysize 2048 -validity 10950 -storepass soundcloudx -keypass soundcloudx \
                -dname 'CN=SoundCloud X development, O=SoundCloud X, C=IR'
            fi
            echo "KEYSTORE_FILE=$KEY" >> "$GITHUB_ENV"
            echo 'KEYSTORE_PASSWORD=soundcloudx' >> "$GITHUB_ENV"
            echo 'KEY_ALIAS=soundcloudx' >> "$GITHUB_ENV"
            echo 'KEY_PASSWORD=soundcloudx' >> "$GITHUB_ENV"
            echo 'signing=development' >> "$GITHUB_OUTPUT"
            echo '::warning::Development signing: update compatibility is not guaranteed without a backed-up production keystore.'
          fi
      - name: Unit tests, lint and APKs
        working-directory: android
        env:
          APP_VERSION: ${{ needs.version.outputs.name }}
          APP_CODE: ${{ needs.version.outputs.code }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest :app:lintRelease \
            :app:assembleRelease :app:assembleDebug :app:assembleDebugAndroidTest \
            -PappVersionName="$APP_VERSION" -PappVersionCode="$APP_CODE" 2>&1 | tee ../gradle-build.log
      - name: Verify and collect the exact release APK
        env:
          APP_VERSION: ${{ needs.version.outputs.name }}
        run: |
          set -euo pipefail
          mkdir -p dist test-builds
          APK="android/app/build/outputs/apk/release/SoundCloudX-$APP_VERSION-release.apk"
          test -s "$APK"
          TOOLS="$ANDROID_HOME/build-tools/34.0.0"
          "$TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee dist/android-signature.txt
          "$TOOLS/aapt" dump badging "$APK" | tee dist/android-package.txt
          if grep -q 'application-debuggable' dist/android-package.txt; then exit 1; fi
          grep -q "launchable-activity: name='com.soundcloudx.app.MainActivity'" dist/android-package.txt
          python3 tools/check_apk.py "$APK"
          cp "$APK" "dist/SoundCloudX-$APP_VERSION.apk"
          cp "android/app/build/outputs/apk/debug/SoundCloudX-$APP_VERSION-debug.apk" test-builds/SoundCloudX-debug.apk
          cp android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk test-builds/SoundCloudX-tests.apk
          ls -lh dist/*.apk
      - name: Show useful errors
        if: failure()
        run: |
          if [ -f gradle-build.log ]; then
            grep -E 'error:|FAILURE:|Execution failed|Caused by:|Error:' gradle-build.log | head -30 || true
            tail -60 gradle-build.log
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: android-test-builds
          path: test-builds/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-build-reports
          path: |
            gradle-build.log
            android/app/build/reports/
            android/app/build/test-results/

  android-runtime:
    name: Android runtime (API ${{ matrix.api }})
    needs: [version, android]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        api: [24, 34, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: release-apk
      - uses: actions/download-artifact@v4
        with:
          name: android-test-builds
          path: test-builds
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install, launch/resume release and test real UI/storage/playback
        uses: reactivecircus/android-emulator-runner@v2
        env:
          APP_VERSION: ${{ needs.version.outputs.name }}
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tools/test_android.sh "release-apk/SoundCloudX-$APP_VERSION.apk" test-builds/SoundCloudX-debug.apk test-builds/SoundCloudX-tests.apk "runtime-reports/android-${{ matrix.api }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-runtime-${{ matrix.api }}
          path: runtime-reports/

  windows:
    name: Self-contained Windows EXE and installer
    needs: version
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8.10"
          architecture: x64
      - name: Install build dependencies (not required by end users)
        working-directory: windows
        run: python -m pip install -r requirements.txt
      - name: Set version
        env:
          APP_VERSION: ${{ needs.version.outputs.name }}
        run: python tools/bump_version.py "$env:APP_VERSION"
      - name: Source logic and real UI tests
        working-directory: windows
        env:
          SDL_AUDIODRIVER: dummy
        run: python selftest.py --ui --require-ui
      - name: Build bundled executable
        working-directory: windows
        run: python -m PyInstaller --noconfirm --clean SoundCloudX.spec
      - name: Run the actual EXE without Python on PATH
        run: ./tools/test_windows.ps1 -Exe windows/dist/SoundCloudX.exe -Report runtime-reports/windows-portable.json
      - name: Build complete offline installer
        working-directory: windows
        env:
          APP_VERSION: ${{ needs.version.outputs.name }}
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw 'Inno Setup is not installed on the build runner' }
          & $iscc "/DAppVersion=$env:APP_VERSION" installer.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed' }
      - name: Install and test the installed copy, also without Python
        env:
          APP_VERSION: ${{ needs.version.outputs.name }}
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'Installed SoundCloud X'
          $setup = (Resolve-Path "windows/dist/SoundCloudX-Setup-$env:APP_VERSION-x64.exe").Path
          $p = Start-Process $setup -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',('/DIR="' + $dir + '"')) -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw 'Installer timed out' }
          $p.Refresh()
          if ($p.ExitCode -ne 0) { throw "Installer failed ($($p.ExitCode))" }
          ./tools/test_windows.ps1 -Exe "$dir/SoundCloudX.exe" -Report runtime-reports/windows-installed.json
      - name: Collect verified EXE and setup
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item windows/dist/*.exe dist/
      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/*.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-runtime-reports
          path: |
            runtime-reports/
            windows/build/SoundCloudX/warn-SoundCloudX.txt

  release:
    name: Publish only after runtime checks pass
    needs: [version, android, android-runtime, windows]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: windows-exe
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: windows-runtime-reports
          path: reports/windows
      - uses: actions/download-artifact@v4
        with:
          pattern: android-runtime-*
          path: reports/android
      - name: Checksums and honest build report
        env:
          APP_VERSION: ${{ needs.version.outputs.name }}
          SIGNING: ${{ needs.android.outputs.signing }}
        run: python3 tools/release_manifest.py dist reports
      - name: Publish verified files from this exact commit
        uses: softprops/action-gh-release@v2
        with:
          target_commitish: ${{ github.sha }}
          tag_name: v${{ needs.version.outputs.name }}
          name: SoundCloud X ${{ needs.version.outputs.name }}
          prerelease: ${{ inputs.prerelease == true || needs.android.outputs.signing != 'production' || github.ref != 'refs/heads/main' }}
          fail_on_unmatched_files: true
          body: |
            ## نسخهٔ اصلاح‌شده — SoundCloud X ${{ needs.version.outputs.name }}

            **فایل اجرایی دانلود کنید، نه Source code.**
            * ویندوز: `SoundCloudX-Setup-${{ needs.version.outputs.name }}-x64.exe` نصب‌کنندهٔ کامل و آفلاین؛ نصب پایتون، pip یا کتابخانه لازم نیست.
            * ویندوز پرتابل: `SoundCloudX.exe`؛ پایتون، Tcl/Tk، فونت‌ها، تصاویر، گواهی‌های TLS و موتور صوت داخل فایل بسته‌بندی شده‌اند.
            * اندروید: `SoundCloudX-${{ needs.version.outputs.name }}.apk`؛ شامل کد برنامه و موتور Media3 برای پخش MP3/HLS، نه میان‌بر سایت.

            **تست‌ها:** اجرای خود EXE و نسخهٔ نصب‌شده با PATH بدون پایتون؛ نصب و باز شدن APK نهایی روی شبیه‌ساز اندروید ۷، ۱۴ و ۱۶؛ تست واقعی رابط، ذخیره‌سازی و پخش فایل صوتی محلی.
            این تست‌ها اتصال زندهٔ ساندکلاد، ورود به حساب، کیفیت شبکهٔ شما یا همهٔ گوشی‌ها و ویندوزهای قدیمی را تضمین نمی‌کنند.
            جزئیات و اندازهٔ واقعی فایل‌ها در `build-info.json` و صحت دانلود در `SHA256SUMS.txt`.

            امضای اندروید: **${{ needs.android.outputs.signing }}**. بدون کلید امضای ثابت در Secrets، این یک پیش‌انتشار با کلید توسعه است؛ اگر نسخهٔ قبلی امضای دیگری دارد، ارتقای مستقیم ممکن نیست. داده‌های مهم را نگه دارید و نسخهٔ قبلی را حذف کنید. حجم APK عمداً با فایل اضافی بزرگ نشده است.

            جستجو/ترند، علاقه‌مندی، صف پخش، پخش پس‌زمینه، دانلود MP3 قطعه‌ای و فایل اصلی مجاز. فایل اصلی فقط با اجازهٔ ناشر و دسترسی حساب؛ در صورت نبود دسترسی، خطا نمایش داده می‌شود و MP3 به جای Original تحویل نمی‌شود.
            Windows 7 SP1/8.x: سازگاری کد/رانتایم قدیمی حفظ شده، ولی این سیستم‌ها در CI تست نشده‌اند.
          files: |
            dist/*.apk
            dist/*.exe
            dist/android-signature.txt
            dist/android-package.txt
            dist/SHA256SUMS.txt
            dist/build-info.json
